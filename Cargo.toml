[package]
name = "spinsight"
version = "2.0.0"
edition = "2021"
rust-version = "1.95"
description = "SpinSight MRI simulator – educational MR image simulator (Rust port)"
authors = ["Johan Berglund (original SpinSight)", "Rust port contributors"]
license = "GPL-3.0-or-later"
readme = "README.md"
build = "build.rs"
# the Python package (spinsight/) and its tests are not part of the Rust crate
include = ["/src", "/assets", "/build.rs", "/spinsight/phantoms", "/spinsight/presets", "/README.md", "/LICENSE.md"]

[[bin]]
name = "spinsight"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", default-features = false }
egui_plot = "0.38"
rustfft = "6.4"
rayon = "1.12"
matrixmultiply = "0.3"
roxmltree = "0.21"
toml = "1"
serde = { version = "1", features = ["derive"] }
libm = "0.2"
delaunator = "1"
directories = "6"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# the numerics are unusably slow without optimisation, also in debug builds
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
